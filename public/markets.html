<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market map · Autobought CRM</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/favicon.svg" />
</head>
<body>
  <main>
    <div class="pagehead">
      <div>
        <h1>Market map</h1>
        <div class="muted small">Which markets and categories signed dealers already hold. Active and paused deals hold their markets; cancelled ones free them.</div>
      </div>
      <div class="row" style="gap:8px">
        <select id="prov"><option value="">All provinces</option></select>
        <label style="font-weight:500;color:var(--ink);align-self:center"><input type="checkbox" id="openOnly" /> Only markets with an opening</label>
      </div>
    </div>
    <div class="row" id="tiles" style="margin-bottom:16px"></div>
    <div class="tablewrap">
      <table class="grid-map">
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="card" style="margin-top:16px">
      <h2>Add a market</h2>
      <p class="small muted">Leads are matched to a market by their city. Add nearby towns as aliases so they count toward the right market.</p>
      <form id="add" class="fields">
        <div class="field"><label>City</label><input name="name" required /></div>
        <div class="field"><label>Province</label><input name="province" maxlength="2" placeholder="AB" required /></div>
        <div class="field" style="grid-column:span 2"><label>Nearby towns (aliases)</label><input name="aliases" placeholder="Sherwood Park, St. Albert" /></div>
        <div class="field"><label>&nbsp;</label><button class="primary">Add market</button></div>
      </form>
    </div>
  </main>
  <script src="/app.js"></script>
  <script>
    const { api, esc, toast } = CRM;
    let data;
    async function load() {
      data = await api('/markets');
      const provs = [...new Set(data.markets.map((m) => m.province))];
      if (prov.options.length === 1) prov.innerHTML += provs.map((p) => `<option>${esc(p)}</option>`).join('');
      render();
    }
    function render() {
      head.innerHTML = `<th>Market</th>${data.categories.map((c) => `<th>${esc(c.label)}</th>`).join('')}<th class="num">Dealer leads</th><th></th>`;
      let list = data.markets.filter((m) => !prov.value || m.province === prov.value);
      if (openOnly.checked) list = list.filter((m) => m.active && m.cells.some((c) => c.status === 'open'));
      const cells = data.markets.filter((m) => m.active).flatMap((m) => m.cells);
      const taken = cells.filter((c) => c.status === 'taken').length;
      const tile = (k, v) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
      tiles.innerHTML = tile('Markets', data.markets.filter((m) => m.active).length) + tile('Slots taken', taken) + tile('Slots open', cells.length - taken);
      rows.innerHTML = list.map((m) => `<tr>
        <td class="${m.active ? '' : 'inactive'}"><strong>${esc(m.name)}</strong>, ${esc(m.province)}${m.aliases ? `<div class="small muted">${esc(m.aliases)}</div>` : ''}</td>
        ${m.cells.map((c) => `<td class="${c.status} ${m.active ? '' : 'inactive'}">${c.status === 'open' ? 'Open' : c.dealers.map((d) => `<a href="/lead.html?id=${encodeURIComponent(d.lead_id)}">${esc(d.name)}</a>${d.status === 'paused' ? ' (paused)' : ''}`).join('<br>')}</td>`).join('')}
        <td class="num">${m.leads}${m.open_leads ? ` <span class="small muted">(${m.open_leads} open)</span>` : ''}</td>
        <td class="nowrap"><button data-alias="${m.id}">Aliases</button> <button data-toggle="${m.id}">${m.active ? 'Hide' : 'Show'}</button></td>
      </tr>`).join('') || '<tr><td colspan="6" class="muted">No markets match.</td></tr>';
      rows.querySelectorAll('[data-alias]').forEach((b) => b.onclick = async () => {
        const m = data.markets.find((x) => x.id === Number(b.dataset.alias));
        const v = prompt(`Nearby towns that count as ${m.name} (comma separated)`, m.aliases || '');
        if (v === null) return;
        await api(`/markets/${m.id}`, { method: 'PATCH', body: { aliases: v } }); load();
      });
      rows.querySelectorAll('[data-toggle]').forEach((b) => b.onclick = async () => {
        const m = data.markets.find((x) => x.id === Number(b.dataset.toggle));
        await api(`/markets/${m.id}`, { method: 'PATCH', body: { active: !m.active } }); load();
      });
    }
    prov.onchange = render;
    openOnly.onchange = render;
    add.onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(add);
      try { await api('/markets', { method: 'POST', body: Object.fromEntries(f) }); add.reset(); toast('Market added'); load(); } catch (err) { toast(err.message, true); }
    };
    CRM.header('markets').then(load).catch((e) => toast(e.message, true));
  </script>
</body>
</html>
